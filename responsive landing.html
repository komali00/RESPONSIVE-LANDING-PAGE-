<!DOCTYPE html>
<html>

<head>
    <title>Welcome Website</title>

    <style>
        body {
            text-align: center;
            background-color: lightpink;
            padding-top: 100px;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        img {
            width: 150px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Welcome To My Website</h1>

    <p>Learning Frontend Development</p>

    <button onclick="showMessage()">
        Get Started
    </button>

    <br><br>

    <img src="https://via.placeholder.com/150" alt="Image">

    <script>
        function showMessage() {
            alert("Welcome to My Website!");
        }
    </script>

</body>

</html>
